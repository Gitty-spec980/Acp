<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        #myElement {
            border: 1px solid #b63030;
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <h2>Changing font color</h2>

    <div id="myElement">HIIIIIIIII</div>
    <br>

    <button type="button" onclick="changeStyle()">Click Me</button>

    <script>
        function changeStyle() {
            var element = document.getElementById("myElement");
            element.style.color = "#FF000";
        }
    </script>
</body>

</html>
