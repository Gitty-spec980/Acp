<!DOCTYPE html>
<html>

<head>
    <title>Hobbiesss</title>
    <Style>
        body.dark {
            Color: rgb(21, 255, 0);
            background: rgb(187, 25, 219);
        }

        button {
            display: block;
            margin: 5px;
        }

        .textEntry {
            margin-top: 12px;
            margin-bottom: 15px;
        }
    </Style>

</head>

<body>
    <h1>Hobiess!:)</h1>
    <p id="story">Hello! My name is Anjali and these are my hobbies</p>
    <button onclick="goDark()">I DARE U IF U ARE BRAVE CLICK THIS</button>
    <div class="textEntry">SEE MY HOBBIES
        <input type="text" id="name">
    </div>
    <button onclick="typeAndScream()"> WHAT ABOUT ME?...</button>

    <button onclick="finishTheStory()">ENYPHENNNN!</button>
    <audio id="audio" src="http://reboot-me.com/ouch.mp3" type="audio/mpeg"></audio>
    <script>
        function typeAndScream() {
            document.getElementById("audio").play(); var personName = document.getElementById("name").value; alert("My favorite hobby is scaring you heheheh" + personName);
        }

        function goDark() {
            document.body.className = "dark";
        }

        function finishTheStory() {
            document.getElementById("story").innerHTML = "I HOPE TO SEE YOU ALL AGAIN SOON!'";
        }
    </script>
</body>

</html>
